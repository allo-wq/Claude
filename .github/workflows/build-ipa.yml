name: Build IPA

on:
  push:
    branches:
      - main
      - claude/ios-minecraft-java-launcher-hcydmu
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    # macos-15 ships Xcode 16.x — required because current XcodeGen emits
    # the objectVersion-77 project format that Xcode 15 cannot open.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MojoLauncher.xcodeproj \
            -scheme MojoLauncher \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MojoLauncher.app Payload/
          zip -qry MojoLauncher-unsigned.ipa Payload
          ls -la MojoLauncher-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MojoLauncher-unsigned-ipa
          path: MojoLauncher-unsigned.ipa
          if-no-files-found: error

      # Also commit the IPA to dist/ on the same branch so it is fetchable
      # over plain git (Actions artifact downloads live on an Azure CDN that
      # some networks can't reach). [skip ci] prevents a retrigger loop.
      - name: Publish IPA to dist/ on this branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          cp MojoLauncher-unsigned.ipa dist/
          git add dist/MojoLauncher-unsigned.ipa
          git commit -m "ci: publish unsigned IPA for $(git rev-parse --short HEAD~0) [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
