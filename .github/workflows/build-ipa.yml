name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [claude/geometry-dash-remake-wkl4n4, main]
    paths:
      - index.html
      - ios/**
      - .github/workflows/build-ipa.yml

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bundle the game into the app resources
        run: cp index.html ios/Resources/index.html

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project GDRemake.xcodeproj \
            -target GDRemake \
            -configuration Release \
            -sdk iphoneos \
            build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Release-iphoneos/GDRemake.app Payload/
          zip -r GDRemake-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDRemake-unsigned-ipa
          path: GDRemake-unsigned.ipa

      - name: Publish IPA to the ipa-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ipa-latest \
            --title "GD Remake — latest IPA" \
            --notes "Unsigned iOS build of the latest commit. Sideload with Sideloadly or AltStore." \
            || true
          gh release upload ipa-latest GDRemake-unsigned.ipa --clobber

      - name: Push IPA to the ipa-dist branch
        run: |
          mkdir dist
          cp GDRemake-unsigned.ipa dist/
          cd dist
          git init -b ipa-dist
          git -c user.name=ci -c user.email=ci@invalid add GDRemake-unsigned.ipa
          git -c user.name=ci -c user.email=ci@invalid commit -m "IPA build ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ipa-dist
