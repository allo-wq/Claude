name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: hooked
          path: build/libs/*.jar

      # Commit the built jar back to the branch so it can be downloaded
      # straight from the repo (dist/). [skip ci] prevents a build loop.
      - name: Publish jar to dist/
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          cp $(ls build/libs/*.jar | grep -v -- '-sources') dist/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist jar unchanged"
          else
            git commit -m "Publish built mod jar to dist/ [skip ci]"
            git push
          fi
